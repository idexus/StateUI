# The core's suite on Linux, and the GTK host's.
#
# The container is swift.org's own image, so the library compiles with the
# release it is written against. The GTK job runs the host's suite - its own
# tests and every conformance family, each verdict held to the marks under
# exports/marks/gtk - on a screen with no monitor.

name: Linux

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Swift 6.4.0 on Ubuntu 24.04 - the toolchain and the distribution this
    # platform is developed on. A newer image would be a deliberate move, not a
    # default that changed underneath.
    container: swift:6.4.0-noble
    steps:
      # THE CHECKOUT DIRECTORY HAS TO BE CALLED StateUI, for the reason
      # tests.yml carries: a bare "StateUI" dependency is matched against the
      # package identity, which for a path dependency is the directory's name.
      - uses: actions/checkout@v7.0.1

      - name: Report the toolchain
        run: swift --version

      - name: Swift tests
        run: swift test

      - name: Host layer tests
        run: swift test --package-path lib/StateUI.Host

      # The conformance runner's own rules and every contract's family complete,
      # pure Swift: no host runs here, so no verdict is read or written.
      - name: Conformance runner tests
        run: swift test --package-path lib/StateUI.Conformance

  # GTK 4 and libadwaita as Ubuntu 24.04 has them, the versions the host is
  # written against, drawn on Xvfb with a session bus. A label is measured in
  # the font GNOME gives this platform's desktop, so a verdict that reads a
  # frame holds here as it was written.
  gtk:
    name: GTK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v7.0.1

      - name: GTK 4, libadwaita, a screen and the desktop's font
        run: |
          apt-get update
          apt-get install -y --no-install-recommends pkg-config libgtk-4-dev libadwaita-1-dev \
            xvfb xauth dbus fonts-ubuntu
          mkdir -p "$HOME/.config/gtk-4.0"
          printf '[Settings]\ngtk-font-name=Ubuntu Sans 11\n' > "$HOME/.config/gtk-4.0/settings.ini"

      - name: Report the toolchain
        run: swift --version

      - name: GTK host tests, every verdict held
        run: dbus-run-session -- xvfb-run -a env GDK_BACKEND=x11 .scripts/GTK/test-gtk.sh
