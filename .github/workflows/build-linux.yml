# The gallery, built for Linux - and both test suites run on the same host.
#
# THIS IS THE ONE PLATFORM WITH NO MAUI WORKLOAD. The head is a plain net10.0
# project, MAUI arrives as ordinary packages, and what draws is Microsoft's own
# GTK4 backend from dotnet/maui-labs - a PREVIEW package, which is why this job
# pins the whole toolchain rather than following a moving default.
#
# The container is swift.org's own image, so the Swift half compiles with the
# release this library is written against; .NET goes in beside it. The apt list
# is what a GTK4 application needs at BUILD time: the development files for the
# backend's own dependencies, and graphene for the small C shim StateUI.Linux
# compiles beside the Swift libraries.
#
# NOTHING RUNS THE APPLICATION HERE - a GTK4 app needs a display, and a build
# that produces the executable and its native payload is what this job proves.
# The suites beside it are the same two a person runs.

name: Linux

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gallery:
    name: Gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Swift 6.3.3 on Ubuntu 24.04 - the toolchain and the distribution this
    # platform is developed on. A newer image would be a deliberate move, not a
    # default that changed underneath.
    container: swift:6.3.3-noble
    steps:
      # THE CHECKOUT DIRECTORY HAS TO BE CALLED StateUI, for the reason
      # tests.yml carries: a bare "StateUI" dependency is matched against the
      # package identity, which for a path dependency is the directory's name.
      - uses: actions/checkout@v7.0.1

      - name: Report the toolchain
        run: swift --version

      # What the GTK4 backend and the shim need to build against. The typelibs
      # are the runtime half and cost nothing here; a machine that RUNS the app
      # needs them and libgtk-4-1.
      - name: Install GTK4 and graphene
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            libgtk-4-dev libgraphene-1.0-dev gir1.2-gtk-4.0 build-essential

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      # No MAUI workload: `UseMaui` is off for every project on this host, and
      # asking for the workload here would fail - it has no Linux packs.
      - name: Build the gallery
        run: dotnet build apps/Gallery -c Debug -f net10.0

      # The starter application, built exactly as `dotnet new stateui` leaves
      # it: one hosting call, one entry point, and StateUI.Linux under both.
      - name: Build HelloWorld
        run: dotnet build apps/HelloWorld -c Debug -f net10.0

  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.3.3-noble
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Swift tests
        run: swift test --package-path src/Tests

      - name: C# tests
        run: dotnet test src/Tests/StateUIRuntime.Tests
