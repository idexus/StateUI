# The core's suite on Linux.
#
# The container is swift.org's own image, so the library compiles with the
# release it is written against. No host runs on Linux yet; the suite is what
# proves the core builds and behaves here.

name: Linux

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Swift 6.4.0 on Ubuntu 24.04 - the toolchain and the distribution this
    # platform is developed on. A newer image would be a deliberate move, not a
    # default that changed underneath.
    container: swift:6.4.0-noble
    steps:
      # THE CHECKOUT DIRECTORY HAS TO BE CALLED StateUI, for the reason
      # tests.yml carries: a bare "StateUI" dependency is matched against the
      # package identity, which for a path dependency is the directory's name.
      - uses: actions/checkout@v7.0.1

      - name: Report the toolchain
        run: swift --version

      - name: Swift tests
        run: swift test
