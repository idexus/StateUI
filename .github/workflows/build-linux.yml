# The core's suites on Linux - the library, the host layer and the conformance
# runner - and the Gallery's, with the starter application built, since no
# suite compiles it. The GTK host's suite stands in gtk.yml.
#
# The container is swift.org's own image, so the library compiles with the
# release it is written against.

name: Core Linux

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Swift 6.4.0 on Ubuntu 24.04 - the toolchain and the distribution this
    # platform is developed on. A newer image would be a deliberate move, not a
    # default that changed underneath.
    container: swift:6.4.0-noble
    steps:
      # THE CHECKOUT DIRECTORY HAS TO BE CALLED StateUI: a bare "StateUI"
      # dependency is matched against the package identity, which for a path
      # dependency is the directory's name.
      - uses: actions/checkout@v7.0.1

      - name: Report the toolchain
        run: swift --version

      - name: Swift tests
        run: swift test

      - name: Host layer tests
        run: swift test --package-path lib/StateUI/StateUI.Host

      # The conformance runner's own rules and every contract's family complete,
      # pure Swift: no host runs here, so no verdict is read or written.
      - name: Conformance runner tests
        run: swift test --package-path lib/StateUI/StateUI.Conformance

  gallery:
    name: Gallery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Report the toolchain
        run: swift --version

      - name: Gallery tests
        run: swift test --package-path apps/Gallery

      - name: HelloWorld tests
        run: swift test --package-path apps/HelloWorld
