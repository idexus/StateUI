name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  stateui:
    name: StateUI
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test StateUI
        run: swift test
      # Swift written for the MAUI host alone stands under `#if MAUI`.
      - name: Test StateUI under the MAUI condition
        run: swift test --scratch-path .build-maui -Xswiftc -DMAUI

  appkit:
    name: StateUI.AppKit
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test StateUI.AppKit
        run: swift test --package-path lib/StateUI.AppKit

  gallery:
    name: Gallery
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 27.0
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test Gallery
        run: swift test --package-path apps/Gallery
      # The samples and the handbook's examples written for the MAUI host alone.
      - name: Test Gallery under the MAUI condition
        run: swift test --package-path apps/Gallery --scratch-path apps/Gallery/.build-maui -Xswiftc -DMAUI
