name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  stateui:
    name: StateUI
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test StateUI
        run: swift test
      # Swift written for the MAUI host alone stands under `#if MAUI`.
      - name: Test StateUI under the MAUI condition
        run: swift test --scratch-path .build-maui -Xswiftc -DMAUI

  appkit:
    name: StateUI.AppKit
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test StateUI.AppKit
        run: swift test --package-path lib/StateUI.AppKit

  gallery:
    name: Gallery
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Use Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer
      - name: Report the toolchain
        run: swift --version
      - name: Test Gallery
        run: swift test --package-path apps/Gallery
      # The samples and the handbook's examples written for the MAUI host alone.
      - name: Test Gallery under the MAUI condition
        run: swift test --package-path apps/Gallery --scratch-path apps/Gallery/.build-maui -Xswiftc -DMAUI

  maui:
    name: StateUI.Maui
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      # The C# suite drives MAUI's controls as ordinary objects over the
      # fixtures the StateUI suite writes, so it needs the .NET SDK and ICU and
      # no workload: on Linux the MAUI packages arrive as plain references.
      - name: Install what .NET needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libicu-dev
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Test StateUI.Maui
        run: dotnet test lib/StateUI.Maui/Tests
