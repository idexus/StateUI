name: Proposal
description: An idea for something to add or change - bring it here before writing code
labels: ["proposal"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for anything that adds or renames what an application can
        reach, moves the host contract, adds a dependency, or needs a substantial
        design decision.

        A bug uses the Bug form instead: every bug fix starts from a Bug issue
        with a reproducible example before implementation begins.

        A typo, a documentation-only correction, or repository maintenance may
        go straight to a pull request.

        Describe the change rather than pasting an implementation: code you
        want used travels as a pull request, where the CLA covers it.

  - type: textarea
    id: what
    attributes:
      label: What you want to add or change
      description: One paragraph, and the call site as you would like to write it.
      placeholder: |
        Text("Hello").lineBreakMode(.tailTruncation)
    validations:
      required: true

  - type: textarea
    id: platforms
    attributes:
      label: Native platform evidence
      description: >
        Name the equivalent capability in the applicable native host families,
        including any semantic mismatch StateUI must resolve.
      placeholder: AppKit NSTextField, UIKit UILabel, Android TextView...
    validations:
      required: true

  - type: checkboxes
    id: touches
    attributes:
      label: What it touches
      options:
        - label: The public API surface - a control, a modifier, a token, an act
        - label: The host contract
        - label: A build script, or a new dependency
        - label: One platform only, or one platform differently from the others

  - type: textarea
    id: why
    attributes:
      label: Why it is needed, and what you do without it
      description: >
        The workaround, if there is one, and what it costs. A proposal that
        names the workaround is easier to answer than one that does not.
    validations:
      required: true

  - type: dropdown
    id: implement
    attributes:
      label: Would you write it?
      options:
        - "Yes, once this is agreed"
        - "Yes - it is written already, and I will open the pull request"
        - "No - reporting the need"
    validations:
      required: true

  - type: checkboxes
    id: licence
    attributes:
      label: Licence
      options:
        - label: >
            Anything I write here is offered under the project's Apache 2.0
            licence, and I have the right to offer it. An idea needs nothing
            more; code I want used travels as a pull request, where the CLA
            covers it.
          required: true
