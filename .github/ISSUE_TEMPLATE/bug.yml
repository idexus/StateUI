name: Bug
description: Something behaves differently from what the documentation says
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        A security problem is not this: it goes through the private channel in
        SECURITY.md, never into a public issue.

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true

  - type: checkboxes
    id: platforms
    attributes:
      label: Where you saw it
      description: >
        Native toolkits differ, so name every host on which the behavior was
        exercised.
      options:
        - label: AppKit / macOS
        - label: .NET MAUI / Android
        - label: .NET MAUI / iOS
        - label: .NET MAUI / Mac Catalyst
        - label: .NET MAUI / Windows
        - label: .NET MAUI / Linux

  - type: textarea
    id: repro
    attributes:
      label: The smallest thing that reproduces it
      description: >
        A few lines of Swift, or a failing test. Worth more than a description.
      render: swift
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The StateUI version and Swift toolchain if the build is what failed.
      placeholder: StateUI 0.4.0, Swift 6.4
    validations:
      required: true
