<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
<!-- The app icon's foreground: the StateUI mark, in white, on the gradient
     stateui_bkg.svg paints. The same two plates and the same opening as
     Resources/Images/stateui_mark.svg - one mark, drawn once per place it is
     needed. See that file for what the shape says.

     THE MARK FILLS 54.17% OF THE BOX, which is what stateui_tile.svg does and
     what every piece of this artwork does now: one proportion, so the mark reads
     the same wherever it is drawn. Android is the exception it cannot solve on
     its own - a launcher shows only the middle of an adaptive icon, so the
     csproj gives that platform a ForegroundScale to match. -->
  <g transform="translate(76.0, 76.0) scale(4.75)">
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M16,6 H32 A10,10 0 0 1 42,16 V32 A10,10 0 0 1 32,42 H16 A10,10 0 0 1 6,32 V16 A10,10 0 0 1 16,6 Z
             M32,22 H48 A10,10 0 0 1 58,32 V48 A10,10 0 0 1 48,58 H32 A10,10 0 0 1 22,48 V32 A10,10 0 0 1 32,22 Z"/>
  </g>
</svg>
