<?xml version="1.0" encoding="UTF-8"?>
<svg width="48" height="48" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
  <!-- A circled i: the button that shows what every render cost.

       THE RING IS 2.2 OF THESE 48 UNITS, AND THE MARK 36, the mark taken off the
       bar rather than chosen. A ToolbarButton has no font of its own, so the
       library's own ⓘ is drawn at whatever the bar's caption font says - 14 px
       across, measured - while an icon is given the bar's own 22 px slot: 36
       units of this box draw 16.5 there, which is the bigger mark that was
       asked for and the same size as the house beside it. The ring is thin on
       purpose, a pixel, so the mark reads as the glyph it replaces and not as a
       filled disc. -->
  <g fill="#000000">
    <path fill-rule="evenodd"
          d="M24 6a18 18 0 1 0 0 36 18 18 0 1 0 0-36zm0 2.2a15.8 15.8 0 1 1 0 31.6 15.8 15.8 0 1 1 0-31.6z"/>
    <circle cx="24" cy="16.4" r="2.2"/>
    <rect x="22.2" y="21.8" width="3.6" height="12.4" rx="1.8"/>
  </g>
</svg>
