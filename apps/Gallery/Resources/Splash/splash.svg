<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
  <!-- The launch screen: the StateUI mark, in white, on the brand violet the
       csproj names. The same two plates and the same opening as
       Resources/Images/stateui_mark.svg and Resources/AppIcon/stateui_mark.svg
       - one mark, drawn once per place that needs it. Change one, change all.

       THE MARK FILLS 54.17% OF THE BOX, the proportion stateui_tile.svg sets and
       every piece of this artwork keeps. It also happens to be what Android 12 and
       later need: a launch image is masked to a circle there, and a mark drawn to
       the edges loses its corners. -->
  <g transform="translate(13.33, 13.33) scale(0.8333)">
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M16,6 H32 A10,10 0 0 1 42,16 V32 A10,10 0 0 1 32,42 H16 A10,10 0 0 1 6,32 V16 A10,10 0 0 1 16,6 Z
             M32,22 H48 A10,10 0 0 1 58,32 V48 A10,10 0 0 1 48,58 H32 A10,10 0 0 1 22,48 V32 A10,10 0 0 1 32,22 Z"/>
  </g>
</svg>
