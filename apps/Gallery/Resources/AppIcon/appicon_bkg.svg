<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
  <!-- The app icon's background: the identity gradient, violet warming
       into rose, on the diagonal the mark leans along.
       The foreground is appicon_mark.svg. -->
  <defs>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A4BE6"/>
      <stop offset="0.55" stop-color="#8B6BFF"/>
      <stop offset="1" stop-color="#CB61A0"/>
    </linearGradient>
  </defs>
  <rect width="456" height="456" fill="url(#identity)"/>
</svg>
