<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!-- The app icon on macOS: the identity gradient and the white mark, laid on
       the platform's icon grid. A macOS icon is a 1024 canvas whose body is an
       824-point rounded square 100 points in from every edge, with room below
       it for its shadow - so artwork drawn edge to edge stands larger in the
       Dock than every icon beside it. The AppKit head hands this file to the
       host, and the Gallery's bundle makes its .icns from it.

       The mark fills 54.17% of the body, the proportion stateui_tile.svg sets, and
       its path is the one stateui_mark.svg carries. -->
  <defs>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="1" stop-color="#F05138"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#identity)" filter="url(#shadow)"/>
  <g transform="translate(237.33, 237.33) scale(8.5833)">
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M16,6 H32 A10,10 0 0 1 42,16 V32 A10,10 0 0 1 32,42 H16 A10,10 0 0 1 6,32 V16 A10,10 0 0 1 16,6 Z
             M32,22 H48 A10,10 0 0 1 58,32 V48 A10,10 0 0 1 48,58 H32 A10,10 0 0 1 22,48 V32 A10,10 0 0 1 32,22 Z"/>
  </g>
</svg>
