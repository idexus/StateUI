<?xml version="1.0" encoding="UTF-8"?>
<!-- The mark on its ground, as one ready-made image for the template's page:
     the app icon's two halves - the identity gradient and the white mark -
     drawn into a single rounded tile, so the page needs one Image and no
     drawing code. The path is the same one stateui_mark.svg carries; see that
     file for what the shape says and why the opening is uneven. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="1" stop-color="#F05138"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#identity)"/>
  <g transform="translate(21.33, 21.33) scale(1.3333)">
    <path fill="#FFFFFF" fill-rule="evenodd"
          d="M16,6 H32 A10,10 0 0 1 42,16 V32 A10,10 0 0 1 32,42 H16 A10,10 0 0 1 6,32 V16 A10,10 0 0 1 16,6 Z
             M32,22 H48 A10,10 0 0 1 58,32 V48 A10,10 0 0 1 48,58 H32 A10,10 0 0 1 22,48 V32 A10,10 0 0 1 32,22 Z"/>
  </g>
</svg>
