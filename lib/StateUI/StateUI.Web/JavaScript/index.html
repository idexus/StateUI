<!-- The page a Web head runs in: .scripts/Web/run-app.sh writes the application's names in place of the marks. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>{{application}}</title>
<link rel="stylesheet" href="./stateui-web.css?v={{stamp}}">
<script type="module">
  import { start } from "./stateui-web.js?v={{stamp}}";
  start("./{{module}}?v={{stamp}}");
</script>
</head>
<body></body>
</html>
