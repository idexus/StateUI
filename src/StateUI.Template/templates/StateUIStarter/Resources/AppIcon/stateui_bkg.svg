<?xml version="1.0" encoding="UTF-8"?>
<svg width="456" height="456" viewBox="0 0 456 456" xmlns="http://www.w3.org/2000/svg">
<!-- The app icon's background: the identity gradient, .NET's violet into
     Swift's orange, on the diagonal the mark leans along.
     The foreground is appiconfg.svg. -->
  <defs>
    <linearGradient id="identity" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#512BD4"/>
      <stop offset="1" stop-color="#F05138"/>
    </linearGradient>
  </defs>
  <rect width="456" height="456" fill="url(#identity)"/>
</svg>
